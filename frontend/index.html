<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The app has its own dark theme: page-recolouring extensions such as Dark Reader leave it alone. -->
    <meta name="darkreader-lock" />
    <script>
      // The starting theme, set before the first paint so it never flashes: the choice saved by the header's
      // "Dark mode" toggle (src/theme.ts), else the system setting. index.css keys the dark tokens on it.
      document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      try {
        const saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
      } catch {
        // Storage blocked (a private window): keep the system setting.
      }
    </script>
    <title>Inbox Triage</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
